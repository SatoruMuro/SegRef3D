name: SliceBridge

on:
  pull_request:
    paths:
      - "slice-bridge/**"
      - ".github/workflows/slice-bridge.yml"
  push:
    branches:
      - main
    paths:
      - "slice-bridge/**"
      - ".github/workflows/slice-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test NIfTI conversion
        run: node --test slice-bridge/tests/nifti.test.mjs
