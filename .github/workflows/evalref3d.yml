name: EvalRef3D CPU evaluation
on:
  pull_request:
    paths: ["eval-web/**", "shared/**", "lite-web/custom-model.mjs", "lite-web/training-export.mjs", "ColabNotebooks/*ref3d_backend.py", "ColabNotebooks/*evalref3d*", "ColabNotebooks/EvalRef3D*", "ColabNotebooks/tests/*evalref3d*", "schemas/trainref3d-evaluation*", ".github/workflows/evalref3d.yml"]
  push:
    branches: [main]
    paths: ["eval-web/**", "shared/**", "lite-web/custom-model.mjs", "lite-web/training-export.mjs", "ColabNotebooks/*ref3d_backend.py", "ColabNotebooks/*evalref3d*", "ColabNotebooks/EvalRef3D*", "ColabNotebooks/tests/*evalref3d*", "schemas/trainref3d-evaluation*", ".github/workflows/evalref3d.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ColabNotebooks/evalref3d-requirements.txt jsonschema
      - run: node --test "lite-web/tests/*.test.mjs" "train-web/tests/*.test.mjs" "slice-bridge/tests/*.test.mjs" "eval-web/tests/*.test.mjs"
      - run: python -m unittest discover -s ColabNotebooks/tests -p "test_evalref3d*.py" -v
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node eval-web/tests/evaluation.browser.mjs
        env:
          EVAL_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evalref3d-synthetic-browser-qa
          path: build/evalref3d-browser/
