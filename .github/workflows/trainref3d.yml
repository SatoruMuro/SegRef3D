name: TrainRef3D CPU checks
on:
  pull_request:
    paths: ["train-web/**", "shared/**", "ColabNotebooks/*trainref3d*", "ColabNotebooks/TrainRef3D*", "ColabNotebooks/tests/*trainref3d*", ".github/workflows/trainref3d.yml"]
  push:
    branches: [main]
    paths: ["train-web/**", "shared/**", "ColabNotebooks/*trainref3d*", "ColabNotebooks/TrainRef3D*", "ColabNotebooks/tests/*trainref3d*", ".github/workflows/trainref3d.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "lite-web/tests/*.test.mjs" "train-web/tests/*.test.mjs"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r ColabNotebooks/trainref3d-requirements.txt
      - run: python -m unittest discover -s ColabNotebooks/tests -p "test_*.py" -v
      - run: python ColabNotebooks/tests/run_trainref3d_smoke.py
