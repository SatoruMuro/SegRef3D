name: SegRef3D Lite CI

on:
  pull_request:
    paths:
      - "lite-web/**"
      - "test-data/legacy-svg/**"
      - "SegRef3D/tests/medical_source_fixtures.py"
      - ".github/workflows/lite-web.yml"
  push:
    branches:
      - main
    paths:
      - "lite-web/**"
      - "test-data/legacy-svg/**"
      - "SegRef3D/tests/medical_source_fixtures.py"
      - ".github/workflows/lite-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test mask and export logic
        run: node --test "lite-web/tests/*.test.mjs"
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test 3D rendering and Apple demo workflow
        run: node lite-web/tests/three-viewer.browser.mjs build/preview-qa/oit
      - name: Test Color TIFF and existing export downloads
        run: node lite-web/tests/color-tiff.browser.mjs build/color-tiff-qa
      - name: Set up Python for synthetic DICOM fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test legacy SVG migration from DICOM to training data
        run: |
          python -m pip install numpy nibabel pydicom
          python SegRef3D/tests/medical_source_fixtures.py build/svg-qa/medical
          node lite-web/tests/legacy-svg.browser.mjs build/svg-qa
      - name: Test conventional transparency fallback
        run: OIT_FALLBACK=1 node lite-web/tests/three-viewer.browser.mjs build/preview-qa/fallback
      - name: Save rendering regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-rendering
          path: |
            build/preview-qa/
            build/color-tiff-qa/
            build/svg-qa/
